services:
  db:
    image: postgres:17-alpine
    container_name: nextjs-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nextjs_dashboard
    ports:
      - "5432:5432"
    volumes:
      - nextjs_dashboard_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nextjs_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nextjs_dashboard_pg:
